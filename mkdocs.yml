site_name: StageFlow
site_description: A framework for describing and running JSON-defined pipelines
site_url: https://leo-need-more-coffee.github.io/stageflow/
repo_url: https://github.com/leo-need-more-coffee/stageflow
repo_name: leo-need-more-coffee/stageflow
edit_uri: edit/main/docs/
copyright: MIT

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started:
      - Quick start: quick-start.md
      - Node types: node-types.md
      - Data model: data-model.md
      - Expressions: expressions.md
  - Reference:
      - The entry node: entry-node.md
      - Parallel branches: parallel-branches.md
      - Errors: errors.md
      - Variable typing: variable-typing.md
      - Session control: session-control.md
      - Step debugging: step-debugging.md
      - Built-in stages: built-in-stages.md
      - Stage specification: stage-specification.md
      - Schema and stage specs: schema-and-stage-specs.md
  - Development:
      - Releasing: releasing.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets

plugins:
  - search

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
