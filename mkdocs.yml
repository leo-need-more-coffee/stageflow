site_name: StageFlow
site_description: A framework for describing and running JSON-defined pipelines
site_url: https://leo-need-more-coffee.github.io/stageflow/
repo_url: https://github.com/leo-need-more-coffee/stageflow
repo_name: leo-need-more-coffee/stageflow
edit_uri: edit/main/docs/
copyright: MIT

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started:
      - Quick start: quick-start.md
      - Node types: node-types.md
      - Data model: data-model.md
      - Expressions: expressions.md
  - Tutorial:
      - What we build: tutorial/index.md
      - 1. A pipeline that runs: tutorial/1-first-pipeline.md
      - 2. Data between nodes: tutorial/2-frame.md
      - 3. Choosing the road: tutorial/3-branching.md
      - 4. Two things at once: tutorial/4-parallel.md
      - 5. When a node fails: tutorial/5-errors.md
      - 6. A graph inside a node: tutorial/6-subpipelines.md
      - 7. Watching it run: tutorial/7-debugger.md
  - Building a backend:
      - What a backend is: backend/index.md
      - 1. Your stages: backend/1-stages.md
      - 2. The endpoints: backend/2-endpoints.md
      - 3. What may be composed: backend/3-policy.md
      - 4. What a run costs: backend/4-metering.md
      - 5. Who is calling: backend/5-tenants.md
  - Reference:
      - Nodes:
          - The entry node: entry-node.md
          - The stage node: stage-node.md
          - The condition node: condition-node.md
          - The switch node: switch-node.md
          - The parallel node: parallel-branches.md
          - The try node: try-node.md
          - The map node: map-node.md
          - The subpipeline node: subpipeline-node.md
          - The terminal node: terminal-node.md
      - Errors: errors.md
      - Policy: policy.md
      - Limits: limits.md
      - Variable typing: variable-typing.md
      - Localization: localization.md
      - Session control: session-control.md
      - Step debugging: step-debugging.md
      - Built-in stages: built-in-stages.md
      - Stage specification: stage-specification.md
      - Schema and stage specs: schema-and-stage-specs.md
      - Assistants (MCP): mcp.md
  - Development:
      - Releasing: releasing.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets

plugins:
  - search
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ru
          name: Русский
          build: true
          site_name: StageFlow
          site_description: Фреймворк описания и исполнения JSON-пайплайнов
          nav_translations:
            Home: Главная
            Getting started: Начало работы
            Quick start: Быстрый старт
            Node types: Типы узлов
            Data model: Модель данных
            Expressions: Выражения
            Tutorial: Туториал
            What we build: Что собираем
            1. A pipeline that runs: 1. Первый запуск
            2. Data between nodes: 2. Данные между узлами
            3. Choosing the road: 3. Выбор дороги
            4. Two things at once: 4. Два дела сразу
            5. When a node fails: 5. Когда узел падает
            6. A graph inside a node: 6. Граф внутри узла
            7. Watching it run: 7. Смотрим, как он работает
            Building a backend: Свой бэкенд
            What a backend is: Что такое бэкенд
            1. Your stages: 1. Ваши стадии
            2. The endpoints: 2. Эндпоинты
            3. What may be composed: 3. Что разрешено собирать
            4. What a run costs: 4. Во что обходится прогон
            5. Who is calling: 5. Чей это запрос
            Reference: Справочник
            Nodes: Узлы
            The entry node: Узел entry
            The stage node: Узел stage
            The condition node: Узел condition
            The switch node: Узел switch
            The parallel node: Узел parallel
            The try node: Узел try
            The map node: Узел map
            The subpipeline node: Узел subpipeline
            The terminal node: Узел terminal
            Errors: Ошибки
            Policy: Политика
            Limits: Лимиты
            Variable typing: Типизация переменных
            Localization: Локализация
            Session control: Управление сессией
            Step debugging: Пошаговая отладка
            Built-in stages: Встроенные стадии
            Stage specification: Спецификация стадии
            Schema and stage specs: Схема и спецификации
            Assistants (MCP): Ассистенты (MCP)
            Development: Разработка
            Releasing: Релизы

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
