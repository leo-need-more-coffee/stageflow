[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stageflow-framework"
version = "0.9.0"
description = "StageFlow: pipeline framework for stages"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "лень", email = "pzrnqt1vrss@protonmail.com" }
]
dependencies = [
    "pyyaml",
    "jsonschema>=4.0.0",
    "immutables>=0.20",
    "common-expression-language>=0.9",
]
requires-python = ">=3.11"
keywords = ["pipeline", "workflow", "orchestration", "state-machine", "cel"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/leo-need-more-coffee/stageflow"
Issues = "https://github.com/leo-need-more-coffee/stageflow/issues"

[project.optional-dependencies]
dev = [
    "flake8",
    "build",
    "twine",
]
docs = [
    "mkdocs-material",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["stageflow*"]

[tool.setuptools.package-data]
"stageflow" = ["py.typed", "docs/schemas/pipeline.json"]
